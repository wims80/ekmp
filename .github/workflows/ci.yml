name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: cargo +1.97.1 fmt --check
      - run: shellcheck packaging/linux/install.sh scripts/package-linux.sh

  verify:
    name: Verify (${{ matrix.profile }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        profile: [default, gui]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Check default build
        if: matrix.profile == 'default'
        run: cargo +1.97.1 check --locked
      - name: Lint default build
        if: matrix.profile == 'default'
        run: cargo +1.97.1 clippy --locked --all-targets -- -D warnings
      - name: Test default build
        if: matrix.profile == 'default'
        run: cargo +1.97.1 test --locked
      - name: Test default build with the simulator
        if: matrix.profile == 'default'
        run: cargo +1.97.1 test --locked --features dev-tools
      - name: Check GUI build
        if: matrix.profile == 'gui'
        run: cargo +1.97.1 check --locked --features gui
      - name: Lint all features
        if: matrix.profile == 'gui'
        run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
      - name: Test all features
        if: matrix.profile == 'gui'
        run: cargo +1.97.1 test --locked --all-features
