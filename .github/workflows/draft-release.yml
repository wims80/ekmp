name: Draft release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: draft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Confirm tag version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          test "$version" = "$cargo_version"
      - run: cargo +1.97.1 fmt --check
      - run: cargo +1.97.1 check --locked
      - run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.97.1 test --locked --all-features
      - run: cargo +1.97.1 build --locked --release
      - name: Enforce Linux compatibility floor
        shell: bash
        run: |
          required="GLIBC_2.35"
          maximum="$(objdump -T target/release/ekmp | grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sort -Vu | tail -n 1)"
          test -n "$maximum"
          test "$(printf '%s\n%s\n' "$maximum" "$required" | sort -V | tail -n 1)" = "$required"
      - name: Validate desktop entry
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes desktop-file-utils
          sed 's|@EXEC_PATH@|/home/tester/.local/bin/ekmp|' packaging/linux/ekmp.desktop.in > ekmp.desktop
          desktop-file-validate ekmp.desktop
      - run: bash scripts/package-linux.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*.tar.gz
          retention-days: 1

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Confirm tag version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($version -ne $cargoVersion) { throw "Tag $version does not match Cargo version $cargoVersion" }
      - run: cargo +1.97.1 check --locked
      - run: cargo +1.97.1 clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo +1.97.1 test --locked --all-features
      - run: cargo +1.97.1 build --locked --release
      - shell: pwsh
        run: scripts/package-windows.ps1 -Version $env:GITHUB_REF_NAME.Substring(1)
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*.zip
          retention-days: 1

  create-draft:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums and draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --prerelease --generate-notes ekmp-* SHA256SUMS
