[package]
name = "ekmp"
version = "0.3.0"
edition = "2021"
description = "A Linux CLI and refresh service for explicitly publishing EVE Online killmails to zKillboard"
license = "MIT"
repository = "https://github.com/wims80/ekmp"
rust-version = "1.97"

[features]
default = []
gui = ["dep:eframe", "dep:image", "egui_kittest/eframe"]
dev-tools = ["eframe?/inspection"]

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
ctrlc = { version = "3", features = ["termination"] }
base64 = "0.23"
eframe = { version = "0.36", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
httpdate = "1"
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
keyring = "4.1"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rand = { version = "0.9", default-features = false, features = ["os_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"

[dev-dependencies]
egui_kittest = "0.36.1"
httpmock = "0.8.3"
