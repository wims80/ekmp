[package]
name = "akmp"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
eframe = "0.29"
egui = "0.29"
open = "5"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
