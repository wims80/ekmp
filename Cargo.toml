[package]
name = "ekmp"
version = "0.1.1"
edition = "2021"
description = "A desktop utility for reviewing and explicitly publishing EVE Online killmails to zKillboard"
license = "MIT"
repository = "https://github.com/wims80/ekmp"
rust-version = "1.97"

[dependencies]
base64 = "0.22"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
keyring = "4.1"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "gzip", "json", "rustls-tls"] }
rand = { version = "0.9", default-features = false, features = ["os_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
